name: Daily A-share refresh

on:
  schedule:
    # Beijing 15:50 pre-start; runner waits until 16:10 to collect.
    - cron: '50 7 * * 1-5'
    # Backup starts at Beijing 16:20, 16:35 and 17:15.
    - cron: '20,35 8 * * 1-5'
    - cron: '15 9 * * 1-5'
    # Additional off-hour backups: Beijing 16:47, 17:23 and 18:11.
    - cron: '47 8 * * 1-5'
    - cron: '23 9 * * 1-5'
    - cron: '11 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-market-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect, validate and publish the latest bundle
        run: python runner.py --output latest.json
      - name: Commit a new trading session only
        run: |
          if git diff --quiet -- latest.json; then
            echo "No new validated trading session."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "data: refresh A-share session"
          git push
